<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyquill – Minimal Typing Speed Test</title>
<style>
:root{--bg:#f4f1ea;--sub:#9a9486;--text:#2b2a27;--main:#d4880f;--err:#c2410c;--panel:#e8e4da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1f23;--sub:#646669;--text:#d1d0c5;--main:#e2b714;--err:#ca4754;--panel:#26292e}}
:root[data-theme="dark"]{--bg:#1d1f23;--sub:#646669;--text:#d1d0c5;--main:#e2b714;--err:#ca4754;--panel:#26292e}
:root[data-theme="light"]{--bg:#f4f1ea;--sub:#9a9486;--text:#2b2a27;--main:#d4880f;--err:#c2410c;--panel:#e8e4da}
:root[data-theme="ocean"]{--bg:#0f1c2e;--sub:#5a7391;--text:#cfe3f7;--main:#4fd1c5;--err:#f56565;--panel:#16283f}
:root[data-theme="forest"]{--bg:#17201a;--sub:#5f7a66;--text:#d6e6d3;--main:#9ccc65;--err:#e57373;--panel:#1f2c23}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:ui-monospace,"JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:1000px;padding:24px 20px;box-sizing:border-box;flex:1;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
.logo{font-size:26px;font-weight:700;color:var(--text)}.logo span{color:var(--main)}
.themes button{width:20px;height:20px;border-radius:50%;border:2px solid var(--sub);margin-left:8px;cursor:pointer;padding:0}
.bar{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;background:var(--panel);border-radius:10px;padding:8px 16px;align-self:center;font-size:14px;margin-bottom:40px}
.grp{display:flex;gap:4px;align-items:center}.grp+.grp{border-left:2px solid var(--bg);padding-left:16px}
.bar button{background:none;border:0;color:var(--sub);font:inherit;cursor:pointer;padding:4px 8px;border-radius:6px}
.bar button:hover{color:var(--text)}.bar button.on{color:var(--main)}
#cin{width:84px;background:var(--bg);color:var(--text);border:1px solid var(--sub);border-radius:6px;font:inherit;padding:3px 6px;margin-left:4px}
#live{color:var(--main);font-size:28px;height:40px;opacity:0;transition:opacity .2s}
#live.show{opacity:1}
#box{position:relative;height:calc(3 * 2.1em);font-size:26px;line-height:2.1em;overflow:hidden;cursor:text;outline:none}
#words{position:relative;display:flex;flex-wrap:wrap;transition:transform .15s;color:var(--sub)}
#mob{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
@media (max-width:600px){#box{font-size:20px}.big{font-size:44px}.logo{font-size:22px}}
.word{margin-right:.6em;white-space:nowrap}
.word span.ok{color:var(--text)}.word span.bad{color:var(--err)}
.word span.extra{color:var(--err);opacity:.7}
.word.err{border-bottom:2px solid var(--err)}
#caret{position:absolute;width:2px;height:1.4em;background:var(--main);transition:left .08s,top .08s;animation:b 1s infinite;pointer-events:none}
@keyframes b{50%{opacity:.2}}
#box.blur #words{filter:blur(6px);opacity:.6}
#box.blur::after{content:"Click here or just start typing";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:16px;pointer-events:none}
#box.blur #caret{display:none}
#hint{text-align:center;color:var(--sub);font-size:14px;margin-top:28px}
kbd{background:var(--panel);padding:2px 7px;border-radius:5px}
#res{display:none;text-align:center}
.stats{display:flex;flex-wrap:wrap;gap:20px 48px;justify-content:center;margin:10px 0 24px}
.big{font-size:60px;color:var(--main);line-height:1}.lbl{color:var(--sub);font-size:14px}
.chart{background:var(--panel);border-radius:10px;padding:12px;max-width:100%;overflow-x:auto}
.btn{background:var(--panel);color:var(--text);border:0;font:inherit;padding:10px 22px;border-radius:8px;cursor:pointer;margin-top:24px}
.btn:hover{background:var(--main);color:var(--bg)}
footer{color:var(--sub);font-size:13px;text-align:center;padding:16px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="logo">key<span>quill</span></div>
 <div class="themes" id="themes">
  <button data-t="light" style="background:#f4f1ea" title="Light"></button>
  <button data-t="dark" style="background:#e2b714" title="Dark"></button>
  <button data-t="ocean" style="background:#4fd1c5" title="Ocean"></button>
  <button data-t="forest" style="background:#9ccc65" title="Forest"></button>
 </div>
</header>

<div id="test">
 <div class="bar">
  <div class="grp" id="modes"><button data-m="time" class="on">time</button><button data-m="words">words</button></div>
  <div class="grp" id="vals"></div>
  <div class="grp"><button id="punc">punctuation</button></div>
 </div>
 <div id="live">0</div>
 <div id="box" class="blur"><input id="mob" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="typing input"><div id="caret"></div><div id="words"></div></div>
 <div id="hint"><kbd>Tab</kbd> restart &nbsp; · &nbsp; <kbd>Enter</kbd> finish now &nbsp; · &nbsp; <button id="fin" style="background:none;border:0;color:var(--sub);font:inherit;cursor:pointer;text-decoration:underline">finish &amp; see result</button></div>
</div>

<div id="res">
 <div class="stats">
  <div><div class="lbl">wpm</div><div class="big" id="rWpm"></div></div>
  <div><div class="lbl">accuracy</div><div class="big" id="rAcc"></div></div>
 </div>
 <div class="stats">
  <div><div class="lbl">raw</div><div id="rRaw"></div></div>
  <div><div class="lbl">characters</div><div id="rChars"></div></div>
  <div><div class="lbl">time</div><div id="rTime"></div></div>
  <div><div class="lbl">personal best</div><div id="rBest"></div></div>
 </div>
 <div class="chart" id="chart"></div>
 <button class="btn" id="again">next test (Tab)</button>
</div>
</div>
<footer>Speed comes from accuracy, and accuracy comes from patience. Every session makes you better.</footer>

<script>
const WORDS="the be of and a to in he have it that for they with as not on she at by this we you do but from or which one would all will there say who make when can more if no man out other so what time up go about than into could state only new year some take come these know see use get like then first any work now may such give over think most even find day also after way many must look before great back through long where much should well people down own just because good each those feel seem how high too place little world very still nation hand old life tell write become here show house both between need mean call develop under last right move thing general school never same another begin while number part turn real leave might want point form off child few small since against ask late home interest large person end open public follow during present without again hold govern around possible head consider word program problem however lead system set order eye plan run keep face fact group play stand increase early course change help line".split(" ");
const PUNC=[",",".","?","!",";"];
const $=s=>document.querySelector(s);
const cfg={mode:"time",time:30,words:25,punc:false};
try{Object.assign(cfg,JSON.parse(localStorage.getItem("tf-cfg")||"{}"))}catch(e){}
let words=[],typed=[],wi=0,started=false,done=false,t0=0,tick=null,samples=[],lastSec=0,cc=0,ac=0,wc=0,errs=[];

function save(){try{localStorage.setItem("tf-cfg",JSON.stringify(cfg))}catch(e){}}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("tf-theme",t)}catch(e){}}
try{const t=localStorage.getItem("tf-theme");if(t)setTheme(t)}catch(e){}
document.querySelectorAll("#themes button").forEach(b=>b.onclick=()=>setTheme(b.dataset.t));

function pick(){let w=WORDS[Math.random()*WORDS.length|0];
 if(cfg.punc){if(Math.random()<.15)w=w[0].toUpperCase()+w.slice(1);if(Math.random()<.2)w+=PUNC[Math.random()*5|0]}return w}
function addWords(n){for(let i=0;i<n;i++){const w=pick();words.push(w);typed.push("");
 const d=document.createElement("div");d.className="word";d.innerHTML=[...w].map(c=>`<span>${c}</span>`).join("");$("#words").appendChild(d)}}

function buildBar(){
 $("#modes").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===cfg.mode));
 const opts=cfg.mode==="time"?[15,30,60,120]:[10,25,50,100];
 const cur=cfg[cfg.mode],isT=cfg.mode==="time",lim=isT?[5,3600]:[5,1000];
 $("#vals").innerHTML=opts.map(v=>`<button data-v="${v}" class="${cur===v?"on":""}">${v}</button>`).join("")+(opts.includes(cur)?"":`<button class="on" data-v="${cur}">${cur}</button>`)+`<button id="cust" title="Custom ${isT?"time":"word count"}">✎ custom</button><input id="cin" type="number" min="${lim[0]}" max="${lim[1]}" placeholder="${isT?"seconds":"words"}" style="display:none">`;
 $("#vals").querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>{cfg[cfg.mode]=+b.dataset.v;save();reset()});
 const ci=$("#cin");
 $("#cust").onclick=()=>{ci.style.display="";ci.focus()};
 ci.onkeydown=e=>{e.stopPropagation();if(e.key==="Escape"){ci.style.display="none";focusBox()}
  if(e.key==="Enter"){const v=Math.round(+ci.value);if(v>=lim[0]&&v<=lim[1]){cfg[cfg.mode]=v;save();reset()}else{ci.value="";ci.placeholder=lim[0]+"–"+lim[1]}}};
 $("#punc").classList.toggle("on",cfg.punc);
}
$("#modes").querySelectorAll("button").forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;save();reset()});
$("#punc").onclick=()=>{cfg.punc=!cfg.punc;save();reset()};

function reset(){
 clearInterval(tick);words=[];typed=[];wi=0;started=done=false;samples=[];errs=[];lastSec=0;cc=ac=wc=0;
 $("#words").innerHTML="";$("#words").style.transform="translateY(0)";
 addWords(cfg.mode==="words"?cfg.words:60);
 $("#res").style.display="none";$("#test").style.display="";
 $("#live").className="";$("#live").textContent=cfg.mode==="time"?cfg.time:"0/"+cfg.words;
 buildBar();focusBox();caret();
}
function focusBox(){$("#mob").focus({preventScroll:true});$("#box").classList.remove("blur")}
$("#mob").addEventListener("blur",()=>$("#box").classList.add("blur"));
$("#mob").addEventListener("focus",()=>$("#box").classList.remove("blur"));
$("#box").onclick=focusBox;
// phone keyboards report key 'Unidentified', so read the input event instead
let realKey=true;
document.addEventListener("keydown",e=>{realKey=e.key!=="Unidentified"&&e.keyCode!==229},true);
$("#mob").addEventListener("input",e=>{
 if(!realKey){const d=e.data,fire=k=>document.dispatchEvent(new KeyboardEvent("keydown",{key:k}));
  if(e.inputType==="deleteContentBackward")fire("Backspace");else if(d)for(const ch of d)fire(ch)}
 e.target.value=""});

function wordEl(i){return $("#words").children[i]}
function paint(i){
 const el=wordEl(i),w=words[i],t=typed[i];
 el.querySelectorAll(".extra").forEach(e=>e.remove());
 [...el.children].forEach((s,k)=>{s.className=k<t.length?(t[k]===w[k]?"ok":"bad"):""});
 for(let k=w.length;k<t.length;k++){const s=document.createElement("span");s.className="extra";s.textContent=t[k];el.appendChild(s)}
}
function caret(){
 const el=wordEl(wi);if(!el)return;const t=typed[wi].length;
 const c=$("#caret"),box=$("#box").getBoundingClientRect();
 let x,y;
 if(t<el.children.length){const r=el.children[t].getBoundingClientRect();x=r.left;y=r.top}
 else{const r=el.lastElementChild.getBoundingClientRect();x=r.right;y=r.top}
 const lh=parseFloat(getComputedStyle($("#box")).lineHeight);
 // scroll lines so current line is the 2nd visible
 // keep the current line on the 2nd row: scroll by layout offset (never accumulates, so text can't vanish)
 const off=Math.max(0,(Math.round(el.offsetTop/lh)-1)*lh);
 $("#words").style.transform=`translateY(${-off}px)`;
 const L=t<el.children.length?el.children[t]:el.lastElementChild;
 c.style.left=(L.offsetLeft+(t<el.children.length?0:L.offsetWidth))+"px";
 c.style.top=(L.offsetTop-off+lh*0.3)+"px";
}

function start(){started=true;t0=performance.now();$("#live").className="show";
 tick=setInterval(()=>{const e=(performance.now()-t0)/1000;
  if(cfg.mode==="time"){$("#live").textContent=Math.max(0,Math.ceil(cfg.time-e));if(e>=cfg.time)finish()}
  const s=Math.floor(e);if(s>lastSec){lastSec=s;samples.push(stats(e).wpm)}
 },100)}
function counts(){let c=0,a=0,w=0,err=0;
 const n=Math.min(wi+1,words.length);
 for(let i=0;i<n;i++){const t=typed[i],x=words[i];if(!t&&i===wi)continue;
  for(let k=0;k<t.length;k++){a++;if(t[k]===x[k])c++;else err++}
  if(i<wi){a++;c+=(t===x)?1:0;if(t!==x)err++}
  if(i<wi&&t===x)w++}
 return {c,a,err}}
function stats(e){const {c,a}=counts(),m=Math.max(e,.1)/60;
 return {wpm:Math.round(c/5/m),raw:Math.round(a/5/m),acc:a?Math.round(c/a*100):100,c,a}}

function finish(early){
 if(done)return;done=true;clearInterval(tick);
 let e=(performance.now()-t0)/1000;if(cfg.mode==="time"&&!early)e=cfg.time;
 const s=stats(e);samples.push(s.wpm);
 $("#test").style.display="none";$("#res").style.display="block";
 $("#rWpm").textContent=s.wpm;$("#rAcc").textContent=s.acc+"%";$("#rRaw").textContent=s.raw;
 $("#rChars").textContent=`${s.c}/${s.a-s.c}`;$("#rTime").textContent=e.toFixed(1)+"s";
 const key=`tf-best-${cfg.mode}-${cfg[cfg.mode]}${cfg.punc?"p":""}`;let best=0;
 try{best=+localStorage.getItem(key)||0}catch(x){}
 const nb=s.wpm>best;if(nb){try{localStorage.setItem(key,s.wpm)}catch(x){}}
 $("#rBest").textContent=(nb?s.wpm+" 🎉 new!":best);
 drawChart(e);$("#again").focus();
}
function drawChart(T){
 const W=700,H=240,p=44,mx=Math.max(20,...samples)*1.1,n=Math.max(samples.length-1,1);
 const pts=samples.map((v,i)=>`${p+i/n*(W-2*p)},${H-p-v/mx*(H-2*p)}`).join(" ");
 const yt=[0,.25,.5,.75,1].map(f=>{const y=H-p-f*(H-2*p);return `<line x1="${p}" x2="${W-p}" y1="${y}" y2="${y}" stroke="var(--sub)" opacity=".15"/><text x="${p-8}" y="${y+4}" text-anchor="end" fill="var(--sub)" font-size="11">${Math.round(mx*f)}</text>`}).join("");
 const xs=Math.max(1,Math.ceil(n/8)),xt=samples.map((_,i)=>i).filter(i=>i%xs===0||i===n).map(i=>`<text x="${p+i/n*(W-2*p)}" y="${H-p+18}" text-anchor="middle" fill="var(--sub)" font-size="11">${i===n?Math.round(T):i+1}s</text>`).join("");
 $("#chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:320px"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--sub)" opacity=".4"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="var(--sub)" opacity=".4"/><polyline points="${pts}" fill="none" stroke="var(--main)" stroke-width="3" stroke-linejoin="round"/>${yt}${xt}<text x="${W/2}" y="${H-4}" text-anchor="middle" fill="var(--sub)" font-size="12">Time (seconds)</text><text transform="rotate(-90)" x="${-H/2}" y="12" text-anchor="middle" fill="var(--sub)" font-size="12">Words per minute</text></svg>`;
}
$("#again").onclick=reset;
$("#fin").onclick=()=>{if(started)finish(true);else focusBox()};

document.addEventListener("keydown",ev=>{
 if(ev.target.id==="cin")return;
 if(ev.key==="Tab"){ev.preventDefault();reset();return}
 if(done||ev.ctrlKey&&ev.key!=="Backspace"||ev.metaKey||ev.altKey)return;
 if(ev.key==="Enter"){ev.preventDefault();if(started)finish(true);return}
 if(document.activeElement!==$("#box")&&ev.key.length===1)focusBox();
 const k=ev.key;
 if(k===" "){ev.preventDefault();if(!typed[wi])return;if(!started)start();
  if(wi>=words.length-1)return;wordEl(wi).classList.toggle("err",typed[wi]!==words[wi]);
  wi++;if(cfg.mode==="time"&&words.length-wi<30)addWords(30);
  if(cfg.mode==="words")$("#live").textContent=wi+"/"+cfg.words;caret();return}
 if(k==="Backspace"){ev.preventDefault();
  if(ev.ctrlKey||ev.altKey)typed[wi]="";else if(typed[wi])typed[wi]=typed[wi].slice(0,-1);
  else if(wi>0&&wordEl(wi-1).classList.contains("err")){wi--;wordEl(wi).classList.remove("err")}
  paint(wi);caret();return}
 if(k.length===1){ev.preventDefault();if(!started)start();
  if(typed[wi].length>=words[wi].length+8)return;
  typed[wi]+=k;paint(wi);caret();
  if(cfg.mode==="words"&&wi===words.length-1&&typed[wi]===words[wi]){wi=words.length;finish()}}
});
window.addEventListener("resize",caret);
reset();
</script>
</body>
</html>
